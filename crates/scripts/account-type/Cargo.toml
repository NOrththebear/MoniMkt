[package]
name = "monimkt-account-type"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Account type script for MoniMkt"

[[bin]]
name = "monimkt-account-type"
path = "src/main.rs"
test = false
doctest = false

[dependencies]
ckb-std = { version = "1.1.0", default-features = false, features = ["allocator", "ckb-types", "calc-hash", "dummy-atomic"] }
monimkt-schemas = { path = "../../schemas" }
