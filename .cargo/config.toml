# CKB-VM does not support RISC-V atomic instructions. Lower atomics to the
# dummy `__atomic_*` functions provided by ckb-std, and enable the bit-manipulation
# extensions used by the CKB Rust templates.
[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "target-feature=+zba,+zbb,+zbc,+zbs",
    "-C", "passes=lower-atomic",
]
