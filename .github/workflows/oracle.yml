name: Oracle keeper

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch:

concurrency:
  group: monimkt-oracle
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: oracle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: oracle/package-lock.json

      - name: Install keeper dependencies
        run: npm ci --no-audit --no-fund

      - name: Publish CKB/USD price
        env:
          CKB_ORACLE_KEY: ${{ secrets.CKB_ORACLE_KEY }}
        run: node keeper.mjs --send
